[project]
name = "funnel-marketing-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.140.0",
    "ipykernel>=6.30.1",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas==2.2.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "supabase>=2.31.0",
    "uvicorn>=0.51.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the idiomatic pattern

[tool.ruff.lint.per-file-ignores]
# Bare expressions are the notebook-cell "auto-display" idiom (like `df.head()`
# with no print), not dead code.
"exploration_and_cleaning.py" = ["B018"]
"customer_lifetime_regression.py" = ["B018"]
"upsell_classification.py" = ["B018"]
"follow_up_analysis.py" = ["B018"]
"budget_optimization.py" = ["B018"]
"upsell_classification_v2.py" = ["B018"]
