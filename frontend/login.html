<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FunnelIQ — Sign in</title>
  <script src="/static/vendor/supabase.js"></script>
  <script src="/static/config.js"></script>
</head>
<body style="font-family: sans-serif; max-width: 320px; margin: 80px auto;">
  <h1>FunnelIQ</h1>
  <form id="login-form">
    <label>Email<br /><input type="email" id="email" required style="width: 100%" /></label><br /><br />
    <label>Password<br /><input type="password" id="password" required style="width: 100%" /></label><br /><br />
    <button type="submit">Sign in</button>
  </form>
  <p id="error" style="color: red;"></p>

  <script>
    if (typeof window.supabase === "undefined") {
      document.getElementById("error").textContent = "Failed to load the auth library. Please reload the page.";
    } else {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        try {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            document.getElementById("error").textContent = error.message;
            return;
          }
          window.location.href = "/dashboard";
        } catch (err) {
          document.getElementById("error").textContent = "Unexpected error: " + err.message;
        }
      });
    }
  </script>
</body>
</html>
